<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transactions — Danous</title>
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --green-dark: #0a2a20; --green-main: #0a4a3a; --green-mid: #0d6b55;
            --green-light: #e6f9f0; --green-pale: #f0f7f4; --accent: #1db87a;
            --text: #1a1a2e; --text-muted: #888; --border: #e8e8e8;
            --bg: #f4f6f5; --white: #fff; --red: #e53935; --red-light: #fdecea;
        }
        body { font-family: 'Inter', system-ui, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

        /* NAV */
        .nav { background: var(--white); border-bottom: 1px solid var(--border); padding: 0 24px; height: 56px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; }
        .nav-logo { display: flex; align-items: center; gap: 9px; text-decoration: none; }
        .nav-logo-icon { width: 32px; height: 32px; background: var(--green-main); border-radius: 8px; display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 700; font-size: 15px; }
        .nav-logo-name { font-weight: 700; font-size: 16px; color: var(--green-dark); }
        .nav-links { display: flex; gap: 4px; }
        .nav-link { padding: 6px 14px; border-radius: 7px; font-size: 13px; font-weight: 500; color: var(--text-muted); text-decoration: none; transition: background .15s, color .15s; }
        .nav-link:hover, .nav-link.active { background: var(--green-pale); color: var(--green-main); font-weight: 600; }
        .nav-user { display: flex; align-items: center; gap: 10px; }
        .nav-user-name { font-size: 13px; font-weight: 600; }
        .btn-logout { font-size: 12px; padding: 5px 12px; background: none; border: 1px solid var(--border); border-radius: 6px; color: var(--text-muted); cursor: pointer; font-family: inherit; }
        .btn-logout:hover { border-color: var(--red); color: var(--red); }

        /* PAGE */
        .page { max-width: 1000px; margin: 0 auto; padding: 32px 20px; }
        .page-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; }
        .page-title { font-size: 22px; font-weight: 700; color: var(--green-dark); }
        .page-sub { font-size: 13px; color: var(--text-muted); margin-top: 2px; }

        .btn-primary { padding: 9px 18px; background: var(--green-main); color: #fff; border: none; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; font-family: inherit; transition: background .2s; display: inline-flex; align-items: center; gap: 6px; }
        .btn-primary:hover { background: var(--green-mid); }

        /* SUMMARY CARDS */
        .summary { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-bottom: 24px; }
        .summary-card { background: var(--white); border: 1px solid var(--border); border-radius: 12px; padding: 16px 20px; }
        .summary-label { font-size: 12px; color: var(--text-muted); margin-bottom: 6px; }
        .summary-value { font-size: 22px; font-weight: 700; }
        .summary-value.income { color: #0a6640; }
        .summary-value.expense { color: var(--red); }
        .summary-value.balance { color: var(--green-main); }

        /* FILTERS */
        .filters { background: var(--white); border: 1px solid var(--border); border-radius: 12px; padding: 16px 20px; margin-bottom: 20px; display: flex; gap: 12px; flex-wrap: wrap; align-items: flex-end; }
        .filter-group { flex: 1; min-width: 130px; }
        .filter-group label { display: block; font-size: 11px; font-weight: 600; color: #555; margin-bottom: 5px; }
        .filter-group input, .filter-group select { width: 100%; padding: 8px 10px; border: 1.5px solid var(--border); border-radius: 7px; font-size: 13px; font-family: inherit; outline: none; background: #fafafa; }
        .filter-group input:focus, .filter-group select:focus { border-color: var(--green-main); }

        /* TABLE */
        .table-wrap { background: var(--white); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
        table { width: 100%; border-collapse: collapse; }
        th { background: var(--bg); font-size: 12px; font-weight: 600; color: var(--text-muted); padding: 12px 16px; text-align: left; border-bottom: 1px solid var(--border); }
        td { padding: 12px 16px; font-size: 13px; border-bottom: 1px solid var(--border); }
        tr:last-child td { border-bottom: none; }
        tr:hover td { background: #fafafa; }
        .amount-income { color: #0a6640; font-weight: 700; }
        .amount-expense { color: var(--red); font-weight: 700; }
        .badge { padding: 3px 8px; border-radius: 20px; font-size: 11px; font-weight: 600; background: var(--bg); color: var(--text-muted); }
        .badge-income { background: var(--green-light); color: #0a6640; }
        .badge-expense { background: var(--red-light); color: var(--red); }
        .btn-del { background: none; border: none; cursor: pointer; color: var(--text-muted); font-size: 14px; padding: 4px 6px; border-radius: 5px; transition: color .15s, background .15s; }
        .btn-del:hover { color: var(--red); background: var(--red-light); }
        .empty-row td { text-align: center; padding: 40px; color: var(--text-muted); font-size: 13px; }

        /* MODAL */
        .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(10,42,32,.45); z-index: 200; align-items: center; justify-content: center; padding: 20px; }
        .modal-overlay.open { display: flex; }
        .modal { background: var(--white); border-radius: 16px; width: 100%; max-width: 480px; padding: 28px; box-shadow: 0 20px 60px rgba(0,0,0,.18); }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 22px; }
        .modal-title { font-size: 18px; font-weight: 700; color: var(--green-dark); }
        .modal-close { background: none; border: none; cursor: pointer; font-size: 18px; color: var(--text-muted); width: 28px; height: 28px; border-radius: 6px; }
        .modal-close:hover { background: var(--bg); }
        .form-group { margin-bottom: 14px; }
        .form-label { display: block; font-size: 12px; font-weight: 600; color: #555; margin-bottom: 5px; }
        .form-input, .form-select { width: 100%; padding: 10px 12px; border: 1.5px solid var(--border); border-radius: 8px; font-size: 13px; color: var(--text); background: #fafafa; outline: none; font-family: inherit; transition: border-color .2s; }
        .form-input:focus, .form-select:focus { border-color: var(--green-main); background: var(--white); }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .type-toggle { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .type-btn { padding: 10px; border: 1.5px solid var(--border); border-radius: 8px; background: none; font-size: 13px; font-weight: 600; cursor: pointer; font-family: inherit; transition: all .15s; color: var(--text-muted); }
        .type-btn.active-expense { border-color: var(--red); background: var(--red-light); color: var(--red); }
        .type-btn.active-income { border-color: var(--accent); background: var(--green-light); color: #0a6640; }
        .modal-footer { display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px; }
        .btn-secondary { padding: 9px 18px; background: none; border: 1.5px solid var(--border); border-radius: 8px; font-size: 13px; font-weight: 600; color: var(--text-muted); cursor: pointer; font-family: inherit; }
        .msg { display: none; padding: 10px 12px; border-radius: 8px; font-size: 13px; margin-bottom: 14px; text-align: center; }
        .msg.show { display: block; }
        .msg.error { background: var(--red-light); color: #a32d2d; }
        .msg.success { background: var(--green-light); color: #0a6640; }

        @media (max-width: 600px) {
            .summary { grid-template-columns: 1fr; }
            .form-row { grid-template-columns: 1fr; }
            .nav-links { display: none; }
        }
    </style>
</head>
<body>

<nav class="nav">
    <a href="#" class="nav-logo">
        <div class="nav-logo-icon">D</div>
        <span class="nav-logo-name">Danous</span>
    </a>
    <div class="nav-links">
        <a href="index.html" class="nav-link">Dashboard</a>
        <a href="budgets.html" class="nav-link">Budgets</a>
        <a href="transcations.html" class="nav-link active">Transactions</a>
        <a href="alerts.html" class="nav-link">Alerts</a>

    </div>
    <div class="nav-user">
        <span class="nav-user-name" id="navUserName">—</span>
        <button class="btn-logout" onclick="logout()">Sign out</button>
    </div>
</nav>

<div class="page">
    <div class="page-header">
        <div>
            <h1 class="page-title">Transactions</h1>
            <p class="page-sub">Track your income and expenses across budgets.</p>
        </div>
        <button class="btn-primary" onclick="openModal()">＋ Add Transaction</button>
    </div>

    <!-- Summary -->
    <div class="summary">
        <div class="summary-card">
            <div class="summary-label">Total Income</div>
            <div class="summary-value income" id="totalIncome">0.00 TND</div>
        </div>
        <div class="summary-card">
            <div class="summary-label">Total Expenses</div>
            <div class="summary-value expense" id="totalExpense">0.00 TND</div>
        </div>
        <div class="summary-card">
            <div class="summary-label">Balance</div>
            <div class="summary-value balance" id="totalBalance">0.00 TND</div>
        </div>
    </div>

    <!-- Filters -->
    <div class="filters">
        <div class="filter-group">
            <label>Type</label>
            <select id="filterType">
                <option value="">All</option>
                <option value="income">Income</option>
                <option value="expense">Expense</option>
            </select>
        </div>
        <div class="filter-group">
            <label>Category</label>
            <select id="filterCategory">
                <option value="">All categories</option>
            </select>
        </div>
        <div class="filter-group">
            <label>Budget</label>
            <select id="filterBudget">
                <option value="">All budgets</option>
            </select>
        </div>
        <div class="filter-group">
            <label>From</label>
            <input type="date" id="filterStart">
        </div>
        <div class="filter-group">
            <label>To</label>
            <input type="date" id="filterEnd">
        </div>
        <div class="filter-group">
            <label>&nbsp;</label>
            <button class="btn-primary" onclick="loadTransactions()" style="width:100%">Filter</button>
        </div>
    </div>

    <!-- Table -->
    <div class="table-wrap">
        <table>
            <thead>
                <tr>
                    <th>Date</th>
                    <th>Description</th>
                    <th>Category</th>
                    <th>Budget</th>
                    <th>Type</th>
                    <th>Amount</th>
                    <th></th>
                </tr>
            </thead>
            <tbody id="txBody">
                <tr class="empty-row"><td colspan="7">Loading transactions…</td></tr>
            </tbody>
        </table>
    </div>
</div>

<!-- MODAL -->
<div class="modal-overlay" id="modalOverlay">
    <div class="modal">
        <div class="modal-header">
            <h2 class="modal-title">Add Transaction</h2>
            <button class="modal-close" onclick="closeModal()">✕</button>
        </div>
        <div id="modalMsg" class="msg"></div>
        <form id="txForm">
            <!-- Type toggle -->
            <div class="form-group">
                <label class="form-label">Type</label>
                <div class="type-toggle">
                    <button type="button" class="type-btn active-expense" id="btnExpense" onclick="setType('expense')">💸 Expense</button>
                    <button type="button" class="type-btn" id="btnIncome" onclick="setType('income')">💰 Income</button>
                </div>
                <input type="hidden" name="type" id="txType" value="expense">
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label class="form-label">Amount (TND)</label>
                    <input type="number" class="form-input" name="amount" placeholder="0.00" min="0.01" step="0.01" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Date</label>
                    <input type="date" class="form-input" name="date" required>
                </div>
            </div>

            <div class="form-group">
                <label class="form-label">Description</label>
                <input type="text" class="form-input" name="description" placeholder="What was this for?">
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label class="form-label">Category</label>
                    <select class="form-select" name="category_id" id="txCategory">
                        <option value="">— None —</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label">Budget <span style="font-weight:400;color:var(--text-muted)">(optional)</span></label>
                    <select class="form-select" name="budget_id" id="txBudget">
                        <option value="">— None —</option>
                    </select>
                </div>
            </div>

            <div class="modal-footer">
                <button type="button" class="btn-secondary" onclick="closeModal()">Cancel</button>
                <button type="submit" class="btn-primary" id="submitBtn">Save</button>
            </div>
        </form>
    </div>
</div>

<script>
const API = 'http://localhost:8080/backend';
let categories = [], budgets = [];

document.addEventListener('DOMContentLoaded', async () => {
    const name = sessionStorage.getItem('user_name') || localStorage.getItem('user_name');
    if (!name) { window.location.href = 'login.html'; return; }
    document.getElementById('navUserName').textContent = name;

    // Set today as default date
    document.querySelector('[name=date]').value = new Date().toISOString().split('T')[0];

    await Promise.all([loadCategories(), loadBudgets()]);
    await loadTransactions();
});

async function loadCategories() {
    try {
        const res = await fetch(`${API}/budgets/list_categories.php`, { credentials: 'include' });
        categories = await res.json();
        const opts = categories.map(c => `<option value="${c.id}">${c.name}</option>`).join('');
        document.getElementById('txCategory').innerHTML = '<option value="">— None —</option>' + opts;
        document.getElementById('filterCategory').innerHTML = '<option value="">All categories</option>' + opts;
    } catch { categories = []; }
}

async function loadBudgets() {
    try {
        const res = await fetch(`${API}/budgets/list_budget.php`, { credentials: 'include' });
        budgets = await res.json();
        if (!Array.isArray(budgets)) budgets = [];
        const opts = budgets.map(b => `<option value="${b.id}">${b.name}</option>`).join('');
        document.getElementById('txBudget').innerHTML = '<option value="">— None —</option>' + opts;
        document.getElementById('filterBudget').innerHTML = '<option value="">All budgets</option>' + opts;
    } catch { budgets = []; }
}

async function loadTransactions() {
    const body = document.getElementById('txBody');
    body.innerHTML = '<tr class="empty-row"><td colspan="7">Loading…</td></tr>';

    const params = new URLSearchParams();
    const type = document.getElementById('filterType').value;
    const cat  = document.getElementById('filterCategory').value;
    const bud  = document.getElementById('filterBudget').value;
    const start = document.getElementById('filterStart').value;
    const end   = document.getElementById('filterEnd').value;
    if (type)  params.set('type', type);
    if (cat)   params.set('category_id', cat);
    if (bud)   params.set('budget_id', bud);
    if (start) params.set('start', start);
    if (end)   params.set('end', end);

    try {
        const res = await fetch(`${API}/transactions/list_transactions.php?${params}`, { credentials: 'include' });
        const data = await res.json();

        if (!Array.isArray(data) || data.length === 0) {
            body.innerHTML = '<tr class="empty-row"><td colspan="7">No transactions found.</td></tr>';
            updateSummary([]);
            return;
        }

        body.innerHTML = data.map(t => `
            <tr>
                <td>${fmt(t.date)}</td>
                <td>${esc(t.description || '—')}</td>
                <td><span class="badge">${esc(t.category_name || '—')}</span></td>
                <td>${esc(t.budget_name || '—')}</td>
                <td><span class="badge badge-${t.type}">${t.type}</span></td>
                <td class="amount-${t.type}">${t.type === 'expense' ? '−' : '+'}${fmtMoney(t.amount)} TND</td>
                <td><button class="btn-del" onclick="deleteTx(${t.id})">🗑</button></td>
            </tr>`).join('');

        updateSummary(data);
    } catch (e) {
        body.innerHTML = `<tr class="empty-row"><td colspan="7">Error: ${e.message}</td></tr>`;
    }
}

function updateSummary(data) {
    const income  = data.filter(t => t.type === 'income').reduce((s, t) => s + parseFloat(t.amount), 0);
    const expense = data.filter(t => t.type === 'expense').reduce((s, t) => s + parseFloat(t.amount), 0);
    document.getElementById('totalIncome').textContent  = fmtMoney(income) + ' TND';
    document.getElementById('totalExpense').textContent = fmtMoney(expense) + ' TND';
    document.getElementById('totalBalance').textContent = fmtMoney(income - expense) + ' TND';
}

function setType(type) {
    document.getElementById('txType').value = type;
    document.getElementById('btnExpense').className = 'type-btn' + (type === 'expense' ? ' active-expense' : '');
    document.getElementById('btnIncome').className  = 'type-btn' + (type === 'income'  ? ' active-income'  : '');
}

function openModal() {
    document.getElementById('txForm').reset();
    document.querySelector('[name=date]').value = new Date().toISOString().split('T')[0];
    setType('expense');
    document.getElementById('modalOverlay').classList.add('open');
}
function closeModal() {
    document.getElementById('modalOverlay').classList.remove('open');
    document.getElementById('modalMsg').className = 'msg';
}
document.getElementById('modalOverlay').addEventListener('click', e => {
    if (e.target === document.getElementById('modalOverlay')) closeModal();
});

document.getElementById('txForm').addEventListener('submit', async e => {
    e.preventDefault();
    const btn = document.getElementById('submitBtn');
    btn.disabled = true; btn.textContent = 'Saving…';

    const fd = new FormData(e.target);
    try {
        const res = await fetch(`${API}/transactions/create_transaction.php`, {
            method: 'POST', body: fd, credentials: 'include'
        });
        const json = await res.json();
        if (json.success) {
            closeModal();
            loadTransactions();
        } else {
            const msg = document.getElementById('modalMsg');
            msg.textContent = json.message || 'Error saving transaction.';
            msg.className = 'msg show error';
        }
    } catch (err) {
        const msg = document.getElementById('modalMsg');
        msg.textContent = 'Network error: ' + err.message;
        msg.className = 'msg show error';
    }
    btn.disabled = false; btn.textContent = 'Save';
});

async function deleteTx(id) {
    if (!confirm('Delete this transaction?')) return;
    const fd = new FormData(); fd.append('id', id);
    const res = await fetch(`${API}/transactions/delete_transaction.php`, {
        method: 'POST', body: fd, credentials: 'include'
    });
    const json = await res.json();
    if (json.success) loadTransactions();
    else alert(json.message || 'Could not delete.');
}

async function logout() {
    await fetch(`${API}/auth/logout.php`, { credentials: 'include' });
    sessionStorage.clear(); localStorage.clear();
    window.location.href = 'login.html';
}

function esc(s) { return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmt(d) { return d ? new Date(d).toLocaleDateString('en-GB', {day:'2-digit', month:'short', year:'numeric'}) : '—'; }
function fmtMoney(n) { return parseFloat(n||0).toLocaleString('en-US', {minimumFractionDigits:2, maximumFractionDigits:2}); }
</script>
</body>
</html>
