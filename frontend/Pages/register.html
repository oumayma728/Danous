<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscription — Danous</title>
    <link rel="stylesheet" href="../assets/css/auth.css">
    <link rel="stylesheet" href="../assets/css/theme.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <h1 class="auth-title">Créer un compte</h1>
            <p class="auth-subtitle">Rejoignez Danous pour gérer votre budget</p>
            <form id="registerForm">
                <div class="form-group">
                    <label for="name">Nom d'utilisateur</label>
                    <input type="text" id="name" name="name" placeholder="Votre nom" required>
                </div>
                <div class="form-group">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" name="email" placeholder="you@example.com" required>
                </div>
                <div class="form-group">
                    <label for="password">Mot de passe</label>
                    <input type="password" id="password" name="password" placeholder="Min. 6 caractères" required>
                </div>
                <div class="form-group">
                    <label for="confirm_password">Confirmer le mot de passe</label>
                    <input type="password" id="confirm_password" name="confirm_password" placeholder="Répétez le mot de passe" required>
                </div>
                <button type="submit" class="btn-primary" id="submitBtn">Créer un compte</button>
            </form>
            <p class="auth-link">Vous avez déjà un compte ? <a href="login.html">Se connecter</a></p>
        </div>
    </div>
    <script src="../assets/js/auth.js?v=20260606"></script>
    <script src="../assets/js/theme.js"></script>
</body>
</html>
